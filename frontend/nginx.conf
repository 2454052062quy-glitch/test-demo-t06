server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;

  # API: chuyển sang container backend (cổng nội bộ 8000)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;   # đồng bộ POS365 nhiều trang có thể lâu
  }

  # SPA: mọi đường dẫn khác (kể cả /attendance/scan?t=...) trả index.html (không cache index.html)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  location ~* \.(js|css|svg|png|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
}
